[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — ruff format handles this
    "B008",  # do not perform function calls in default argument (FastAPI depends= pattern)
    "B904",  # raise from within except — intentional in some places
]

[tool.ruff.lint.isort]
known-first-party = ["api", "analytics", "db", "maps", "parser", "voice"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # demoparser2, polars, aiosqlite have no stubs
warn_unused_ignores = false
warn_return_any = false
check_untyped_defs = true
